<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
      }
      .placeholder {
        width: 800px;
        height: 400px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        color: white;
        text-align: center;
      }
      .title {
        font-size: 48px;
        font-weight: bold;
        margin-bottom: 10px;
      }
      .subtitle {
        font-size: 24px;
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <div class="placeholder">
      <div class="title">TestGuild</div>
      <div class="subtitle">Blog Post</div>
    </div>
  </body>
</html>
