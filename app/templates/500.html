{% extends "base.html" %} {% block title %}Server Error{% endblock %} {% block
content %}
<div class="max-w-2xl mx-auto text-center py-16">
  <div class="bg-white rounded-lg shadow-md p-12">
    <i class="fas fa-exclamation-triangle text-6xl text-red-300 mb-6"></i>
    <h1 class="text-4xl font-bold text-gray-900 mb-4">500</h1>
    <h2 class="text-2xl font-semibold text-gray-700 mb-6">
      Internal Server Error
    </h2>
    <p class="text-gray-600 mb-8 max-w-md mx-auto">
      Something went wrong on our end. The error has been logged and we'll look
      into it. Please try again later.
    </p>
    <div class="space-x-4">
      <a
        href="{{ url_for('index') }}"
        class="inline-flex items-center bg-primary text-white px-6 py-3 rounded-md hover:bg-secondary transition-colors font-medium"
      >
        <i class="fas fa-home mr-2"></i>
        Go Home
      </a>
      <a
        href="{{ url_for('refresh_data') }}"
        class="inline-flex items-center bg-green-500 text-white px-6 py-3 rounded-md hover:bg-green-600 transition-colors font-medium"
      >
        <i class="fas fa-refresh mr-2"></i>
        Try Refresh
      </a>
    </div>
  </div>
</div>
{% endblock %}
