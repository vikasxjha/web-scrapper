{% extends "base.html" %} {% block title %}Page Not Found{% endblock %} {% block
content %}
<div class="max-w-2xl mx-auto text-center py-16">
  <div class="bg-white rounded-lg shadow-md p-12">
    <i class="fas fa-search text-6xl text-gray-300 mb-6"></i>
    <h1 class="text-4xl font-bold text-gray-900 mb-4">404</h1>
    <h2 class="text-2xl font-semibold text-gray-700 mb-6">Page Not Found</h2>
    <p class="text-gray-600 mb-8 max-w-md mx-auto">
      Sorry, the page you're looking for doesn't exist. It might have been
      moved, deleted, or you entered the wrong URL.
    </p>
    <div class="space-x-4">
      <a
        href="{{ url_for('index') }}"
        class="inline-flex items-center bg-primary text-white px-6 py-3 rounded-md hover:bg-secondary transition-colors font-medium"
      >
        <i class="fas fa-home mr-2"></i>
        Go Home
      </a>
      <a
        href="{{ url_for('view_all') }}"
        class="inline-flex items-center text-primary hover:text-secondary transition-colors font-medium"
      >
        <i class="fas fa-list mr-2"></i>
        View All Posts
      </a>
    </div>
  </div>
</div>
{% endblock %}
